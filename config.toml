# The URL the site will be built for
base_url = "https://inputusername.github.io/zola-hook/"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

title = "Hook"
description = "Hook is a theme for Zola"

taxonomies = [
    { name = "categories" },
    { name = "tags" },
]

[markdown]

bottom_footnotes = true

# Theme can be customised by setting the `theme` variable below to a theme supported by Zola
[markdown.highlighting]
theme = "gruvbox-dark-medium"

[extra]
# Put all your custom variables here

links = [
    { title = "Mail", href = "mailto:example@example.com" },
    { title = "GitHub", href = "https://github.com" },
    { title = "LinkedIn", href = "https://linkedin.com" }
]
